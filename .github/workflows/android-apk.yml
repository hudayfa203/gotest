# GO World News — Android build pipeline
#
#   pull request / push to main  → typecheck + unit tests → release APK (workflow artifact) → emulator smoke test
#   push to main with a new "version" in package.json (no release vX.Y.Z yet), or push a tag vX.Y.Z
#                                → the same, then GitHub Release "vX.Y.Z" with the APK attached
#                                  (and a Google Play bundle as an artifact, if an upload key is configured)
#   Actions → Android APK → Run workflow  → manual build (never published), optionally against another API server
#
# Optional repository settings (Settings → Secrets and variables → Actions). Nothing here is required for a test APK:
#   variables  GW_API_URL                       API the app talks to (default https://goworld.news/api/v1)
#              EAS_PROJECT_ID                   Expo project id, enables push notification tokens
#   secrets    ANDROID_UPLOAD_KEYSTORE_BASE64   upload key (.jks, base64) — Google Play signing; see docs/RELEASING.md
#              ANDROID_UPLOAD_STORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS, ANDROID_UPLOAD_KEY_PASSWORD
#              GOOGLE_SERVICES_JSON_BASE64      Firebase google-services.json (base64) — Android push delivery (FCM)
name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'API base URL for this build (blank = repository variable GW_API_URL, else https://goworld.news/api/v1)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'
  GW_API_URL: ${{ inputs.api_url || vars.GW_API_URL || 'https://goworld.news/api/v1' }}

jobs:
  checks:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx jest --ci

  apk:
    name: Build release APK
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      apk_name: ${{ steps.version.outputs.apk_name }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    env:
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
      HAS_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          base=$(node -p "require('./package.json').version")
          [[ "$base" =~ $semver ]] || { echo "::error::package.json version '$base' is not MAJOR.MINOR.PATCH"; exit 1; }
          tag=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
            [[ "$name" =~ $semver ]] || { echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"; exit 1; }
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]] && ! gh release view "v$base" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # first build of a new package.json version on main → publish it as release v<version>
            name="$base"
            tag="v$base"
          else
            name="${base}-build.${GITHUB_RUN_NUMBER}"
          fi
          code="${GITHUB_RUN_NUMBER}"
          {
            echo "version_name=$name"
            echo "version_code=$code"
            echo "apk_name=GO-World-News-v${name}.apk"
            echo "release_tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "Building $name (versionCode $code) for $GW_API_URL${tag:+ → will publish release $tag}"

      - name: Firebase config (optional — Android push delivery)
        if: env.HAS_FIREBASE == 'true'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > "$RUNNER_TEMP/google-services.json"
          echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"

      - name: Upload key (optional — Google Play signing)
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Generate the native Android project (expo prebuild)
        env:
          CI: '1'
          EXPO_PUBLIC_API_URL: ${{ env.GW_API_URL }}
          GW_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          GW_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Android SDK packages for this React Native version
        run: |
          toml=node_modules/react-native/gradle/libs.versions.toml
          get() { sed -n "s/^$1 = \"\(.*\)\"/\1/p" "$toml" | head -n 1; }
          compile=$(get compileSdk); tools=$(get buildTools); ndk=$(get ndkVersion)
          echo "compileSdk=$compile buildTools=$tools ndk=$ndk"
          sdkm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes 2>/dev/null | "$sdkm" --install "platforms;android-$compile" "build-tools;$tools" "ndk;$ndk" > "$RUNNER_TEMP/sdkmanager.log" 2>&1 \
            || echo "::warning::sdkmanager could not pre-install every package; Gradle will try to download what is missing"
          bt="$ANDROID_HOME/build-tools/$tools"
          [ -d "$bt" ] || bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "BUILD_TOOLS=$bt" >> "$GITHUB_ENV"

      - name: Build the release APK (Gradle)
        working-directory: android
        env:
          EXPO_PUBLIC_API_URL: ${{ env.GW_API_URL }}
          # test APKs can be pointed at another server from Settings → Server (never set for Play builds)
          EXPO_PUBLIC_ALLOW_SERVER_OVERRIDE: '1'
          NODE_ENV: production
          GW_UPLOAD_STORE_FILE: ${{ env.HAS_UPLOAD_KEY == 'true' && format('{0}/upload.jks', runner.temp) || '' }}
          GW_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          GW_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          GW_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -o pipefail
          # arm64-v8a + armeabi-v7a cover every Samsung phone; x86_64 is for the emulator test.
          # R8 minification stays off in test APKs so crash reports from testers have readable stack traces.
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 \
            -Pandroid.enableMinifyInReleaseBuilds=false \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Explain a failed build
        if: failure()
        run: |
          esc() { local s="$1"; s="${s//'%'/'%25'}"; s="${s//$'\r'/}"; s="${s//$'\n'/'%0A'}"; printf '%s' "$s"; }
          for f in "$RUNNER_TEMP/gradle.log" "$RUNNER_TEMP/sdkmanager.log"; do
            [ -f "$f" ] || continue
            what=$(grep -n -A 12 -E "What went wrong|FAILURE: Build failed|^e: |error: " "$f" | head -n 60)
            [ -n "$what" ] || what=$(tail -n 40 "$f")
            echo "::error title=$(basename "$f") — what went wrong::$(esc "$what")"
            { echo "### $(basename "$f")"; echo '```'; echo "$what"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Verify the APK (package, version, signature)
        env:
          APK_NAME: ${{ steps.version.outputs.apk_name }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::No APK was produced"; exit 1; }
          "$BUILD_TOOLS/aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='news.goworld.app' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" "$RUNNER_TEMP/badging.txt" \
            || { head -n 3 "$RUNNER_TEMP/badging.txt"; echo "::error::Unexpected package/version in the APK"; exit 1; }
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/signing.txt"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/signing.txt" || { cat "$RUNNER_TEMP/signing.txt"; exit 1; }
          cert=$(grep -m1 "certificate SHA-256 digest" "$RUNNER_TEMP/signing.txt" | awk '{print $NF}')
          minsdk=$(sed -n "s/^minSdkVersion:'\([0-9]*\)'.*/\1/p" "$RUNNER_TEMP/badging.txt")
          target=$(sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p" "$RUNNER_TEMP/badging.txt")
          abis=$(sed -n "s/^native-code: //p" "$RUNNER_TEMP/badging.txt" | tr -d "'")
          mkdir -p dist
          cp "$apk" "dist/$APK_NAME"
          cp "$apk" dist/GO-World-News.apk
          (cd dist && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
          sha=$(cut -d' ' -f1 "dist/$APK_NAME.sha256")
          size=$(du -h "$apk" | cut -f1)
          if [ "$HAS_UPLOAD_KEY" = "true" ]; then signer="upload key (repository secret)"; else signer="test key (React Native debug keystore — side-loading only, never for Google Play)"; fi
          cat > dist/build-info.md <<INFO
          | | |
          |---|---|
          | Version | **$VERSION_NAME** (versionCode $VERSION_CODE) |
          | Package | \`news.goworld.app\` |
          | API server | \`$GW_API_URL\` — can be changed in the app under Settings → Server (test builds) |
          | Android | $([ "$minsdk" = 24 ] && echo "7.0" || echo "API $minsdk")+ (minSdk $minsdk), targets API $target |
          | CPU | $abis |
          | Size | $size |
          | Signed with | $signer |
          | Certificate SHA-256 | \`$cert\` |
          | APK SHA-256 | \`$sha\` |
          | Commit | \`${GITHUB_SHA::12}\` |
          INFO
          sed -i 's/^          //' dist/build-info.md
          cat dist/build-info.md >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=APK built::$VERSION_NAME ($size, $abis) — cert $cert"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/
          if-no-files-found: error
          retention-days: 30

  smoke:
    name: Install and launch on an Android emulator
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on Android 14 (x86_64 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/android-smoke-test.sh dist/GO-World-News.apk smoke
      - name: Verdict
        if: always()
        run: |
          status=$(cat smoke/status 2>/dev/null || echo "not run")
          [ -f smoke/smoke-report.md ] && cat smoke/smoke-report.md >> "$GITHUB_STEP_SUMMARY"
          esc() { local s="$1"; s="${s//'%'/'%25'}"; s="${s//$'\r'/}"; s="${s//$'\n'/'%0A'}"; printf '%s' "$s"; }
          report=$(cat smoke/smoke-report.md 2>/dev/null | cut -c1-600)
          if [ "$status" = "pass" ]; then echo "::notice title=Emulator smoke test passed::$(esc "$report")"; else echo "::error title=Emulator smoke test: $status::$(esc "$report")"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: smoke/
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [apk, smoke]
    if: always() && needs.apk.result == 'success' && needs.apk.outputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: smoke-test
          path: smoke
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.apk.outputs.release_tag }}
          APK_NAME: ${{ needs.apk.outputs.apk_name }}
          SMOKE: ${{ needs.smoke.result }}
        run: |
          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          shots=()
          for f in smoke/*.png; do [ -f "$f" ] && cp "$f" "dist/emulator-$(basename "$f")" && shots+=("dist/emulator-$(basename "$f")"); done
          flags=()
          warn=""
          if [ "$SMOKE" != "success" ]; then
            flags+=(--prerelease)
            warn="> ⚠️ The automatic emulator test did not pass for this build ($SMOKE), so it is marked as a pre-release. Read the report below before installing."
          fi
          {
            echo "## GO World News for Android — $TAG"
            echo
            [ -n "$warn" ] && { echo "$warn"; echo; }
            echo "**Download:** [\`$APK_NAME\`]($repo_url/releases/download/$TAG/$APK_NAME)"
            echo
            echo "Install on a Samsung (or any Android 7.0+) phone: open the download on the phone → allow your browser or My Files to *install unknown apps* → Install. Step-by-step guide with Samsung-specific settings: [docs/INSTALL-SAMSUNG.md]($repo_url/blob/main/docs/INSTALL-SAMSUNG.md)."
            echo
            echo "This is a **test build** for side-loading, not the Google Play version."
            echo
            cat dist/build-info.md
            echo
            if [ -f smoke/smoke-report.md ]; then cat smoke/smoke-report.md; else echo "### Emulator smoke test"; echo "- Not available ($SMOKE)."; fi
            echo
            echo "Emulator screenshots are attached below (\`emulator-*.png\`). Known issues and the full test report: [docs/TESTING.md]($repo_url/blob/main/docs/TESTING.md)."
          } > notes.md
          files=("dist/$APK_NAME" "dist/$APK_NAME.sha256" dist/GO-World-News.apk "${shots[@]}")
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md "${flags[@]}"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "GO World News $TAG (Android test build)" --notes-file notes.md --target "$GITHUB_SHA" "${flags[@]}" "${files[@]}"
          fi
          echo "::notice title=Release published::$repo_url/releases/tag/$TAG"

  play-bundle:
    name: Google Play bundle (AAB, needs the upload key)
    needs: apk
    if: needs.apk.outputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Upload key configured?
        run: |
          if [ "$HAS_UPLOAD_KEY" != "true" ]; then
            echo "::notice title=Google Play bundle skipped::Add the ANDROID_UPLOAD_* secrets (docs/RELEASING.md) to build a signed .aab for Google Play."
          fi
      - uses: actions/checkout@v4
        if: env.HAS_UPLOAD_KEY == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
        if: env.HAS_UPLOAD_KEY == 'true'
      - name: Build the signed Play bundle
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          CI: '1'
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          EXPO_PUBLIC_API_URL: ${{ env.GW_API_URL }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          NODE_ENV: production
          GW_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          GW_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          GW_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          GW_VERSION_NAME: ${{ needs.apk.outputs.version_name }}
          GW_VERSION_CODE: ${{ needs.apk.outputs.version_code }}
          TAG: ${{ needs.apk.outputs.release_tag }}
        run: |
          set -o pipefail
          npm ci
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export GW_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks"
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > "$RUNNER_TEMP/google-services.json"
            export GOOGLE_SERVICES_JSON="$RUNNER_TEMP/google-services.json"
          fi
          npx expo prebuild --platform android --clean --no-install
          cd android
          # store build: no server override, R8 on (Expo defaults), all CPU architectures
          ./gradlew bundleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          mkdir -p ../play && cp app/build/outputs/bundle/release/app-release.aab "../play/GO-World-News-${TAG}-play.aab"
          cp app/build/outputs/mapping/release/mapping.txt ../play/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: play-bundle
          path: play/
          retention-days: 90
